# XcodeGen spec for the iOS app. Generate the Xcode project with:  cd ios && xcodegen
# Identity (bundle id, team, version) lives in Config/Signing.xcconfig so it's edited in one place.
name: PDFStudio
options:
  bundleIdPrefix: app.pdfstudio
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  # Kokoro TTS in Swift (mlx-audio-swift, MIT). Pinned to an exact commit.
  MLXAudio:
    url: https://github.com/Neywa-Labs/mlx-audio-swift
    revision: c7755e2504181a771941bb6f9f26ea79b3cdfce3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.33.0
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 1.0.1
targets:
  PDFStudio:
    type: application
    platform: iOS
    sources:
      - path: PDFStudio
    dependencies:
      - package: MLXAudio
        product: MLXAudioTTS
      - package: MLXAudio
        product: MLXAudioCore
      - package: MLXSwift
        product: MLX
      - package: SwiftHuggingFace
        product: HuggingFace
    entitlements:
      path: PDFStudio/PDFStudio.entitlements
      properties:
        # Lets narration keep using the GPU after you leave the app (iOS 26+, supported devices).
        com.apple.developer.background-tasks.continued-processing.gpu: true
    info:
      path: PDFStudio/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIBackgroundModes: [audio]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).narrate.*
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn, mdwn, mdtxt, mdtext, rmd]
              public.mime-type: [text/markdown, text/x-markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  PDFStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PDFStudioTests]
    dependencies:
      - target: PDFStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  PDFStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PDFStudioUITests]
    dependencies:
      - target: PDFStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PDFStudio
schemes:
  PDFStudio:
    build:
      targets:
        PDFStudio: all
        PDFStudioTests: [test]
        PDFStudioUITests: [test]
    test:
      targets: [PDFStudioTests, PDFStudioUITests]
    archive:
      config: Release
